name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    environment: VPS_HOST
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NODE_ENV: production
        run: pnpm build

      - name: Desplegar
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          rm -rf /home/admin/cisnatura/previous
          [ -d /home/admin/cisnatura/current ] && mv /home/admin/cisnatura/current /home/admin/cisnatura/previous
          cp -r .next/standalone /home/admin/cisnatura/current
          sudo systemctl restart cisnaturatienda
          sleep 3
          curl -sf http://localhost:3000 || (mv /home/admin/cisnatura/previous /home/admin/cisnatura/current && sudo systemctl restart cisnaturatienda && exit 1)